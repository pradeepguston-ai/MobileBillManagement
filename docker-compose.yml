# Mobile Bill Management: web (nginx + React) and API (ASP.NET Core) containers.
# The database is your existing SQL Server; nothing here creates, migrates or changes it.
#
#   1. Copy .env.example to .env and fill in the values.
#   2. docker compose up -d --build
#   3. Open http://<server>:${WEB_PORT}   (health check: http://<server>:${WEB_PORT}/health)

services:
  api:
    build:
      context: .
      dockerfile: src/MobileBill.Api/Dockerfile
    image: mobilebill-api:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Read the client IP from the X-Forwarded-For header that nginx sets (used by the sign-in rate limit).
      # Safe only because the API is not published: nginx is the only thing that can reach it.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING in .env}
      Jwt__Issuer: ${JWT_ISSUER:-MobileBillManagement}
      Jwt__Audience: ${JWT_AUDIENCE:-MobileBillManagement}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_LIFETIME_MINUTES:-480}
      BillStorage__RootPath: /data/bill-uploads
      BillStorage__MaximumFileSizeBytes: "20971520"
      # Only used when the database has no Administrator yet; leave empty to never write anything on start-up.
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Colombo}
    volumes:
      - bill-uploads:/data/bill-uploads
    # Not published to the host: only the web container talks to the API.
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: src/mobilebill-web
    image: mobilebill-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  # Uploaded bill PDFs. Back this up together with the database.
  bill-uploads:
