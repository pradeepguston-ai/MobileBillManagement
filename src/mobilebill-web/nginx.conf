server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Bill PDF uploads (the API accepts up to 20 MB).
  client_max_body_size 25m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # API and health check go to the API container ("api" is its docker-compose service name).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Parsing a bill and building reports can take a while on a remote database.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /health {
    proxy_pass http://api:8080/health;
  }

  # Hashed build files can be cached for a long time.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Every other path is a React page (for example /billing/<id>/review): serve index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
