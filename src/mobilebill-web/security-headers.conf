# Browser security headers, included in every location of nginx.conf.
# nginx drops server-level add_header lines in any location that has its own add_header, so each location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The app loads only its own files. Material UI injects <style> tags, hence 'unsafe-inline' for styles only;
# scripts stay limited to this site, which blocks injected scripts from reading the sign-in token.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Uncomment once the site is served over HTTPS (for example behind a TLS reverse proxy):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
